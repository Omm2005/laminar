# layout.yaml: where each compartment is relative to each vial. The ONLY numbers to measure on the bench.
#
# routes.<vial>.<compartment> = [dx, dy] in millimetres, arm base frame, horizontal plane:
#   dx = away from the arm base (positive = further out), dy = to the arm's left (positive = left).
# Measure from the vial's centre (where its grab ends, tube still in the stand) to the point where the
# tube should hang for pouring into that compartment. `null` = not measured yet.
#
# transfer.py then does, from the pose the grab ends in:
#   lift lift_mm -> shift (dx, dy) at that height -> lower lower_mm -> camera pour (wrist roll)
#   -> lift lower_mm -> shift (-dx, -dy) -> lower lift_mm      (ends exactly where the grab ended)
lift_mm: 150
lower_mm: 110

pour:
  joint: 6             # wrist roll
  direction: 1         # +1 or -1: which way the roll tips the tube's lip toward the compartment
  max_rate_deg_s: 120  # roll speed limit enforced by arm_server
  # side-camera column (as clicked in `python -m laminar.pour_motor6 calibrate`) showing each compartment;
  # the camera pour fills that column. Calibrate every column here, or the wrong-column check can't see it.
  columns: {well_1: A, well_2: B, well_3: C, well_4: D}
  # the level model (sense/level_seg.onnx) reads the boxes drawn in `python live_view.py --new-boxes`
  # (sense/live_boxes.json), named A, B, C, ... left to right: draw one box per compartment above.
  capacity_ml: 4.5     # mL in a full compartment (box rim to floor)
  max_tilt_deg: 85     # never roll further than this from upright

# where the arm carries a vial to pour into each compartment: a spot taught by teleop (spots.yaml). The four
# vial_X_final_position spots run left to right, so they are taken to be over compartments 1-4. CHECK on the bench.
pour_spots: {well_1: vial_A_final_position, well_2: vial_B_final_position, well_3: vial_C_final_position, well_4: vial_D_final_position}

# real-arm skills (software/laminar/real_skills.py)
gripper_open_deg: 78   # jaws open wide enough to go around a vial (arm_server gripper degrees)
approach_mm: 80        # pick / place: come down onto the slot from this far above it
vial_ml: 8             # mL in a vial at the start (until the vials report their own volume)

routes:
  vial_A: {well_1: null, well_2: null, well_3: null, well_4: null}
  vial_B: {well_1: null, well_2: null, well_3: null, well_4: null}
  vial_C: {well_1: null, well_2: null, well_3: null, well_4: null}
  vial_D: {well_1: null, well_2: null, well_3: null, well_4: null}

# which liquid each vial holds (voice + the camera colour check use it)
vials: {vial_A: red, vial_B: blue, vial_C: green, vial_D: yellow}   # vial A = the "blood" sample (red-tinted)
